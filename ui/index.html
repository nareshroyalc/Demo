<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightline RAG Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --background:#fcfcfc; --foreground:#0a0a0a; --card:#ffffff; --muted:#f5f5f5; --muted-fg:#525252;
    --primary:#0066cc; --primary-fg:#ffffff; --border:#e4e4e4; --accent:#ebebeb; --success:#16a34a;
    --destructive:#ff3237; --sidebar:#fcfcfc; --sidebar-accent:#f0f0f0; --radius:8px;
    --font-sans:"Geist",ui-sans-serif,system-ui,sans-serif; --font-mono:"Geist Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background:#0e0e10; --foreground:#f2f2f2; --card:#161618; --muted:#1d1d20; --muted-fg:#a3a3a3;
      --primary:#4c9aff; --primary-fg:#06121f; --border:#2a2a2e; --accent:#26262a; --sidebar:#121214; --sidebar-accent:#1f1f23;
    }
  }
  * { box-sizing:border-box; }
  html,body,#root { height:100%; margin:0; }
  body { font-family:var(--font-sans); background:var(--background); color:var(--foreground); font-size:14px; line-height:1.55; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .app { display:flex; height:100%; }
  .side { width:236px; flex:none; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:14px 10px; gap:4px; }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 10px 14px; font-weight:600; font-size:15px; }
  .logo { width:28px; height:28px; border-radius:50%; background:var(--primary); color:var(--primary-fg); display:grid; place-items:center; font-weight:600; font-size:13px; }
  .nav { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; text-align:left; padding:8px 10px; border-radius:var(--radius); color:var(--muted-fg); }
  .nav:hover { background:var(--sidebar-accent); color:var(--foreground); }
  .nav.on { background:var(--sidebar-accent); color:var(--foreground); font-weight:500; }
  .nav svg { width:16px; height:16px; flex:none; }
  .spacer { flex:1; }
  .status { font-size:12px; color:var(--muted-fg); padding:8px 10px; border-top:1px solid var(--border); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--destructive); }
  .dot.ok { background:var(--success); }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .head { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  .head h1 { font-size:15px; font-weight:600; margin:0; }
  .head .sub { color:var(--muted-fg); font-size:13px; }
  .scroll { flex:1; overflow:auto; }
  .wrap { max-width:820px; margin:0 auto; padding:24px; }
  .wide { max-width:1040px; margin:0 auto; padding:24px; }
  .msg { display:flex; gap:12px; margin-bottom:22px; }
  .avatar { width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:12px; font-weight:600; background:var(--accent); }
  .avatar.bot { background:var(--primary); color:var(--primary-fg); }
  .bubble { min-width:0; flex:1; }
  .user-text { background:var(--muted); border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px; display:inline-block; }
  .md p { margin:0 0 10px; } .md ul,.md ol { margin:0 0 10px; padding-left:20px; }
  .md table { border-collapse:collapse; margin:8px 0 12px; font-size:13px; display:block; overflow:auto; }
  .md th,.md td { border:1px solid var(--border); padding:5px 10px; text-align:left; white-space:nowrap; }
  .md th { background:var(--muted); font-weight:500; }
  .md code { font-family:var(--font-mono); font-size:12.5px; background:var(--muted); padding:1px 5px; border-radius:4px; }
  .md pre { background:var(--muted); padding:10px 12px; border-radius:var(--radius); overflow:auto; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { font-size:12px; border:1px solid var(--border); background:var(--card); border-radius:999px; padding:2px 10px; color:var(--muted-fg); }
  .chip.src { color:var(--primary); border-color:color-mix(in srgb, var(--primary) 35%, var(--border)); cursor:default; }
  details.steps { margin-top:8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); }
  details.steps summary { padding:6px 12px; cursor:pointer; color:var(--muted-fg); font-size:12.5px; }
  .step { padding:6px 12px; border-top:1px solid var(--border); font-family:var(--font-mono); font-size:12px; color:var(--muted-fg); word-break:break-word; }
  .step b { color:var(--foreground); font-weight:500; }
  .composer { border-top:1px solid var(--border); padding:14px 24px 18px; background:var(--background); }
  .composer form { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  .composer textarea { flex:1; resize:none; border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; background:var(--card); color:inherit; font:inherit; height:44px; outline:none; }
  .composer textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  .btn { background:var(--primary); color:var(--primary-fg); border:0; border-radius:var(--radius); padding:0 16px; font-weight:500; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.ghost { background:var(--card); color:var(--foreground); border:1px solid var(--border); padding:6px 12px; }
  .hero { text-align:center; padding:56px 0 18px; }
  .hero h2 { font-size:22px; margin:12px 0 6px; font-weight:600; }
  .hero p { color:var(--muted-fg); margin:0 auto; max-width:520px; }
  .sugg { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; margin-top:26px; }
  .sugg button { text-align:left; border:1px solid var(--border); background:var(--card); border-radius:var(--radius); padding:12px; }
  .sugg button:hover { border-color:var(--primary); }
  .sugg small { display:block; color:var(--primary); font-weight:500; margin-bottom:2px; }
  .card { border:1px solid var(--border); border-radius:var(--radius); background:var(--card); padding:14px 16px; margin-bottom:12px; }
  .card h3 { margin:0 0 4px; font-size:14px; font-weight:600; }
  .card .meta { color:var(--muted-fg); font-size:12.5px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  .row { display:flex; align-items:center; gap:8px; }
  input.search { flex:1; border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px; background:var(--card); color:inherit; font:inherit; outline:none; }
  input.search:focus { border-color:var(--primary); }
  table.data { border-collapse:collapse; width:100%; font-size:13px; }
  table.data th,table.data td { border-bottom:1px solid var(--border); padding:6px 10px; text-align:left; white-space:nowrap; }
  table.data th { position:sticky; top:0; background:var(--muted); font-weight:500; }
  .tablewrap { overflow:auto; max-height:60vh; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); }
  .pill { font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--border); background:var(--card); cursor:pointer; }
  .pill.on { background:var(--primary); color:var(--primary-fg); border-color:var(--primary); }
  pre.code { background:var(--muted); border:1px solid var(--border); border-radius:var(--radius); padding:12px; overflow:auto; font-family:var(--font-mono); font-size:12.5px; }
  select.sel { border:1px solid var(--border); border-radius:var(--radius); background:var(--card); color:inherit; font:inherit; padding:0 10px; height:44px; max-width:170px; }
  .persona-note { max-width:820px; margin:6px auto 0; font-size:12px; color:var(--muted-fg); }
  .step.running b::after { content: " (running…)"; color: var(--primary); font-weight: 400; }
  .typing span { display:inline-block; width:6px; height:6px; margin-right:3px; border-radius:50%; background:var(--muted-fg); animation:b 1.1s infinite; }
  .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
  @keyframes b { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  @media (max-width:760px){ .side{width:64px} .side .label,.brand .t,.status{display:none} .wrap,.wide{padding:16px} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Icon = ({ d }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>
);
const ICONS = {
  chat: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  docs: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h8",
  data: "M3 5c0-1.7 4-3 9-3s9 1.3 9 3-4 3-9 3-9-1.3-9-3z M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5 M3 12c0 1.7 4 3 9 3s9-1.3 9-3",
  skills: "M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z",
  mcp: "M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7 M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7",
};

const api = (u, o) => fetch(u, o).then(r => r.json());
const md = (t) => ({ __html: DOMPurify.sanitize(marked.parse(t || "")) });

const SUGGESTIONS = [
  { tag: "Documents", q: "What is the refund window for damaged items, and who pays return shipping?" },
  { tag: "Database", q: "Top 5 customers by revenue (excluding cancelled orders)." },
  { tag: "Documents + Database", q: "Which delivered orders were late, and what compensation credit does the policy give for each lateness band? Summarise counts per band." },
  { tag: "Documents + Database", q: "Which Platinum customers had late deliveries, and what return window and SLA apply to them?" },
];

function Chat({ health }) {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const end = useRef(null);
  const [personas, setPersonas] = useState([]);
  const [persona, setPersona] = useState("generalist");
  useEffect(() => { api("/api/personas").then(setPersonas).catch(() => {}); }, []);
  const current = personas.find(p => p.id === persona);
  useEffect(() => { end.current && end.current.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);

  const updateLast = (fn) => setMsgs(m => m.map((x, i) => (i === m.length - 1 ? fn(x) : x)));

  // One streamed event from /agent/stream: step (tool called), result (tool finished), token (answer words), done, error.
  const handle = (ev) => {
    if (ev.type === "step") {
      // words written before a tool call were only a draft, so clear them
      updateLast(m => ({ ...m, text: "", steps: [...m.steps, { tool: ev.tool, args: ev.args, running: true }] }));
    } else if (ev.type === "result") {
      updateLast(m => {
        const steps = [...m.steps];
        const i = steps.findIndex(x => x.tool === ev.tool && x.running);
        if (i >= 0) steps[i] = { ...steps[i], running: false, rows: ev.rows, passages: ev.passages, error: ev.error };
        return { ...m, steps };
      });
    } else if (ev.type === "token") {
      updateLast(m => ({ ...m, text: m.text + ev.text }));
    } else if (ev.type === "done") {
      updateLast(() => ({ role: "assistant", text: ev.answer, steps: ev.steps || [], sources: ev.sources || [], persona: ev.persona, usage: ev.usage, live: false }));
    } else if (ev.type === "error") {
      updateLast(m => ({ ...m, text: ev.message, live: false }));
    }
  };

  const send = async (text) => {
    const q = (text ?? input).trim();
    if (!q || busy) return;
    const history = msgs.map(m => ({ role: m.role, text: m.text }));
    setMsgs(m => [...m, { role: "user", text: q }, { role: "assistant", text: "", steps: [], sources: [], live: true, persona }]);
    setInput(""); setBusy(true);
    try {
      const resp = await fetch("/agent/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q, history, persona }) });
      if (!resp.ok || !(resp.headers.get("content-type") || "").includes("text/event-stream")) {
        // errors, the rate-limit message and password prompts arrive as plain JSON
        let r = {}; try { r = await resp.json(); } catch (e) {}
        updateLast(() => ({ role: "assistant", text: r.answer || r.error || r.detail || ("Request failed (" + resp.status + ")"), steps: [], sources: [] }));
      } else {
        const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            const block = buf.slice(0, i); buf = buf.slice(i + 2);
            if (block.startsWith("data: ")) handle(JSON.parse(block.slice(6)));
          }
        }
        updateLast(m => (m.live ? { ...m, live: false, text: m.text || "The connection ended before the answer was finished." } : m));
      }
    } catch (e) {
      updateLast(() => ({ role: "assistant", text: "Request failed: " + e, steps: [], sources: [] }));
    }
    setBusy(false);
  };

  return (
    <>
      <div className="scroll"><div className="wrap">
        {msgs.length === 0 && (
          <div className="hero">
            <div className="logo" style={{ width: 44, height: 44, margin: "0 auto", fontSize: 18 }}>B</div>
            <h2>Ask Brightline</h2>
            <p>An agent over 5 policy PDFs and a sales database. It decides which to use, or both, and shows its work.</p>
            {!health.gemini_key && <p style={{ color: "var(--destructive)", marginTop: 12 }}>No GEMINI_API_KEY set: add it to .env and restart the server.</p>}
            <div className="sugg">{SUGGESTIONS.map(s => (
              <button key={s.q} onClick={() => send(s.q)}><small>{s.tag}</small>{s.q}</button>
            ))}</div>
          </div>
        )}
        {msgs.map((m, i) => (
          <div className="msg" key={i}>
            <div className={"avatar " + (m.role === "assistant" ? "bot" : "")}>{m.role === "assistant" ? "B" : "You"}</div>
            <div className="bubble">
              {m.role === "user" ? <span className="user-text">{m.text}</span> : (
                <>
                  {m.live && !m.text && m.steps.length === 0 && <div className="typing" style={{ paddingTop: 8 }}><span /><span /><span /></div>}
                  <div className="md" dangerouslySetInnerHTML={md(m.text)} />
                  {m.persona && m.persona !== "generalist" && <div className="chips"><span className="chip">Persona: {(personas.find(p => p.id === m.persona) || {}).name || m.persona}</span></div>}
                  {m.sources.length > 0 && <div className="chips">{m.sources.map(s => <span key={s.citation} className="chip src" title={s.snippet}>{s.citation}</span>)}</div>}
                  {m.steps.length > 0 && (
                    <details className="steps" open={m.live ? true : undefined}><summary>{m.steps.length} tool call{m.steps.length > 1 ? "s" : ""}{m.live ? " (working…)" : ""}</summary>
                      {m.steps.map((s, j) => (
                        <div className={"step" + (s.running ? " running" : "")} key={j}><b>{s.tool}</b> {JSON.stringify(s.args)}{s.rows != null ? ` → ${s.rows} rows` : ""}{s.passages != null ? ` → ${s.passages} passages` : ""}{s.error ? ` → ${s.error}` : ""}</div>
                      ))}
                    </details>
                  )}
                  {m.usage && m.usage.calls > 0 && <div className="persona-note" style={{ margin: "6px 0 0" }}>{m.usage.calls} model call{m.usage.calls > 1 ? "s" : ""} · {m.usage.prompt_tokens} prompt tokens ({m.usage.cached_tokens} from cache)</div>}
                </>
              )}
            </div>
          </div>
        ))}
        <div ref={end} />
      </div></div>
      <div className="composer">
        <form onSubmit={e => { e.preventDefault(); send(); }}>
          <select className="sel" value={persona} onChange={e => setPersona(e.target.value)} title="Persona: the role, tools and skills the agent uses">
            {personas.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
          <textarea value={input} placeholder="Ask about policies, orders, shipments…" onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} />
          <button className="btn" disabled={busy || !input.trim()}>Send</button>
        </form>
        {current && <div className="persona-note"><b>{current.name}:</b> {current.description} Tools: {current.tools.join(", ")}.</div>}
      </div>
    </>
  );
}

function Documents() {
  const [docs, setDocs] = useState([]);
  const [q, setQ] = useState("");
  const [hits, setHits] = useState(null);
  const [msg, setMsg] = useState("");
  const load = () => api("/api/documents").then(setDocs);
  useEffect(() => { load(); }, []);
  const search = async (e) => { e.preventDefault(); if (q.trim()) setHits(await api("/api/search?k=6&q=" + encodeURIComponent(q))); };
  const reindex = async () => { setMsg("Indexing…"); const r = await api("/api/ingest", { method: "POST" }); setMsg(`Indexed ${r.chunks} chunks, ${r.vectors} vectors.`); load(); };
  return (
    <div className="scroll"><div className="wide">
      <div className="row" style={{ marginBottom: 16 }}>
        <form onSubmit={search} className="row" style={{ flex: 1 }}>
          <input className="search" placeholder="Test retrieval: e.g. restocking fee for Gold customers" value={q} onChange={e => setQ(e.target.value)} />
          <button className="btn" style={{ height: 36 }}>Search</button>
        </form>
        <button className="btn ghost" onClick={reindex}>Re-index PDFs</button>
      </div>
      {msg && <div className="meta" style={{ marginBottom: 12, color: "var(--muted-fg)" }}>{msg}</div>}
      {hits && (
        <div style={{ marginBottom: 20 }}>
          <div className="meta" style={{ marginBottom: 8, color: "var(--muted-fg)" }}>{hits.length} passages (hybrid vector + keyword)</div>
          {hits.map((h, i) => (
            <div className="card" key={i}><h3>{h.citation}</h3><div className="meta">score {h.score}</div>
              <div style={{ whiteSpace: "pre-wrap", marginTop: 6, fontSize: 13 }}>{h.text}</div></div>
          ))}
        </div>
      )}
      <div className="grid2">{docs.map(d => (
        <div className="card" key={d.doc}><h3>{d.title}</h3><div className="meta">{d.doc} · {d.pages} page(s) · {d.chunks} passages</div>
          <div style={{ marginTop: 10 }}><a href={"/api/documents/" + d.doc + "/file"} target="_blank" rel="noreferrer" style={{ color: "var(--primary)" }}>Open PDF ↗</a></div></div>
      ))}</div>
    </div></div>
  );
}

function DataView() {
  const [tables, setTables] = useState([]);
  const [sel, setSel] = useState(null);
  const [info, setInfo] = useState(null);
  useEffect(() => { api("/api/tables").then(t => { setTables(t); if (t[0]) setSel(t[0].table); }); }, []);
  useEffect(() => { if (sel) { setInfo(null); api("/api/tables/" + sel).then(setInfo); } }, [sel]);
  return (
    <div className="scroll"><div className="wide">
      <div className="chips" style={{ marginTop: 0, marginBottom: 14 }}>
        {tables.map(t => <button key={t.table} className={"pill " + (sel === t.table ? "on" : "")} onClick={() => setSel(t.table)}>{t.table} ({t.rows})</button>)}
      </div>
      {info && (
        <>
          <div className="meta" style={{ color: "var(--muted-fg)", marginBottom: 8 }}>
            {info.columns.map(c => c.name + " " + c.type).join(" · ")}
            {info.foreign_keys.length > 0 && <div>FK: {info.foreign_keys.map(f => f.column + " → " + f.references).join(", ")}</div>}
          </div>
          <div className="tablewrap"><table className="data">
            <thead><tr>{info.rows.columns.map(c => <th key={c}>{c}</th>)}</tr></thead>
            <tbody>{info.rows.rows.map((r, i) => <tr key={i}>{r.map((v, j) => <td key={j}>{v === null ? "—" : String(v)}</td>)}</tr>)}</tbody>
          </table></div>
          {info.rows.truncated && <div className="meta" style={{ color: "var(--muted-fg)", marginTop: 6 }}>Showing first 100 rows.</div>}
        </>
      )}
    </div></div>
  );
}

function Skills() {
  const [skills, setSkills] = useState([]);
  const [personas, setPersonas] = useState([]);
  useEffect(() => { api("/api/skills").then(setSkills); api("/api/personas").then(setPersonas); }, []);
  return (
    <div className="scroll"><div className="wide">
      <h3 style={{ margin: "0 0 8px" }}>Personas</h3>
      <p style={{ color: "var(--muted-fg)", marginTop: 0 }}>A persona is a role: its own instructions, the tools it may use, and the skills it follows. Tool limits are enforced by the server, not just the prompt.</p>
      <div className="grid2" style={{ marginBottom: 20 }}>{personas.map(p => (
        <div className="card" key={p.id}><h3>{p.name}</h3><div className="meta">personas/{p.id}.md</div>
          <p style={{ margin: "8px 0" }}>{p.description}</p>
          <div className="chips">{p.tools.map(t => <span className="chip" key={t}>{t}</span>)}</div>
          <div className="meta" style={{ marginTop: 8 }}>Skills: {p.skills.join(", ")}</div></div>
      ))}</div>
      <h3 style={{ margin: "0 0 8px" }}>Skills</h3>
      <p style={{ color: "var(--muted-fg)", marginTop: 0 }}>Skills are plain <code>SKILL.md</code> playbooks. The built-in agent loads them into its prompt, and the same files work as Claude Code skills in the plugin.</p>
      {skills.map(s => (
        <div className="card" key={s.name}><h3>{s.name}</h3><div className="meta">{s.path}</div>
          <p style={{ margin: "8px 0" }}><b>Use when:</b> {s.description}</p>
          <div className="md" dangerouslySetInnerHTML={md(s.body)} /></div>
      ))}
    </div></div>
  );
}

function Mcp({ health }) {
  const url = location.origin + "/mcp";
  const tools = [
    ["search_docs", "Hybrid search over the policy PDFs, with citations"],
    ["list_documents", "List the searchable documents"],
    ["get_document_page", "Full text of one PDF page"],
    ["list_tables", "Database tables and row counts"],
    ["describe_table", "Columns, keys and sample rows"],
    ["run_sql", "Read-only SELECT (writes rejected, 200-row cap, 5 s timeout)"],
  ];
  return (
    <div className="scroll"><div className="wide">
      <div className="card"><h3>Retrieval-only MCP endpoint</h3>
        <div className="meta">No LLM runs on this endpoint. The connecting agent (Claude Code, Claude Desktop, …) reasons and writes the answer.</div>
        <pre className="code">{url}</pre>
        <div className="meta" style={{ marginBottom: 6 }}>Add to Claude Code:</div>
        <pre className="code">{`claude mcp add --transport http brightline ${url}`}</pre>
      </div>
      <div className="card"><h3>Tools</h3>
        <table className="data"><tbody>{tools.map(([n, d]) => <tr key={n}><td><code>{n}</code></td><td style={{ whiteSpace: "normal" }}>{d}</td></tr>)}</tbody></table>
      </div>
      <div className="card"><h3>Two doors, one retrieval layer</h3>
        <div className="meta"><code>/mcp</code> returns passages and rows only. <code>/agent</code> uses the same functions, then asks Gemini ({health.chat_model}) to write the answer.</div>
      </div>
    </div></div>
  );
}

function App() {
  const [page, setPage] = useState("chat");
  const [health, setHealth] = useState({});
  useEffect(() => { api("/health").then(setHealth).catch(() => {}); }, []);
  const nav = [["chat", "Chat", ICONS.chat], ["docs", "Documents", ICONS.docs], ["data", "Data", ICONS.data], ["skills", "Skills", ICONS.skills], ["mcp", "MCP", ICONS.mcp]];
  const titles = { chat: ["Chat", "Agent: retrieval + generation"], docs: ["Documents", "5 policy PDFs, indexed in Qdrant"], data: ["Data", "SQLite demo database (read-only)"], skills: ["Skills & Personas", "Roles and playbooks the agent follows"], mcp: ["MCP", "Expose retrieval to other agents"] };
  return (
    <div className="app">
      <aside className="side">
        <div className="brand"><div className="logo">B</div><span className="t">Brightline</span></div>
        {nav.map(([k, label, ic]) => (
          <button key={k} className={"nav " + (page === k ? "on" : "")} onClick={() => setPage(k)}><Icon d={ic} /><span className="label">{label}</span></button>
        ))}
        <div className="spacer" />
        <div className="status"><span className={"dot " + (health.gemini_key ? "ok" : "")} />{health.gemini_key ? "Gemini connected" : "No Gemini key"}</div>
      </aside>
      <main className="main">
        <div className="head"><h1>{titles[page][0]}</h1><span className="sub">{titles[page][1]}</span></div>
        {page === "chat" && <Chat health={health} />}
        {page === "docs" && <Documents />}
        {page === "data" && <DataView />}
        {page === "skills" && <Skills />}
        {page === "mcp" && <Mcp health={health} />}
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
